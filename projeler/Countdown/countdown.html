<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Countdown · Demo</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<style>


*{margin:0;padding:0;box-sizing:border-box;}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Segoe UI',Roboto,Arial,sans-serif;
background:#050014;
}

.bg-video{
position:fixed;
top:50%;
left:50%;
min-width:100%;
min-height:100%;
transform:translate(-50%,-50%);
z-index:0;
object-fit:cover;
}

.bg-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
background:radial-gradient(ellipse at 50% 50%,rgba(140,40,255,0.15),rgba(5,0,20,0.5) 70%);
}

.bg-glow{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:2;
background:radial-gradient(ellipse at 50% 40%,rgba(180,80,255,0.12),transparent 60%);
animation:glowPulse 5s ease-in-out infinite alternate;
}

@keyframes glowPulse{
0%{opacity:.5;}
100%{opacity:1;}
}

.content{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
}

.tagline{
font-size:clamp(24px,3.5vw,56px);
font-weight:700;
color:#c850ff;
text-align:center;
text-shadow:0 0 40px rgba(180,60,255,.5);
}

.tagline-sub{
font-size:clamp(18px,2.4vw,42px);
color:white;
margin-top:12px;
margin-bottom:50px;
}

.timer{
display:flex;
align-items:center;
gap:20px;
margin-bottom:30px;
}

.timer-block{
display:flex;
flex-direction:column;
align-items:center;
}

.timer-num{
font-size:clamp(64px,12vw,200px);
font-weight:700;
color:white;
text-shadow:0 0 30px rgba(200,80,255,.4);
}

.timer-label{
font-size:14px;
color:rgba(200,160,255,.7);
margin-top:8px;
letter-spacing:2px;
}

.timer-sep{
font-size:clamp(48px,9vw,150px);
color:rgba(200,130,255,.5);
}

.brand{
margin-top:50px;
display:inline-block;
padding:12px 34px;
border:2px dashed rgba(200,160,255,.55);
border-radius:12px;
color:rgba(230,210,255,.85);
font-family:Consolas,monospace;
font-weight:700;
font-size:20px;
letter-spacing:.3em;
}

.drop-char{
display:inline-block;
will-change:transform;
}

.launch-image{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("launch.jpg") center center / cover no-repeat;
opacity:0;
z-index:100;
pointer-events:none;
transition:opacity 2s ease;
}
.explosion-flash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
opacity:0;
z-index:90;
pointer-events:none;
}

.shockwave{
position:fixed;
top:50%;
left:50%;
width:50px;
height:50px;
border-radius:50%;
border:4px solid rgba(255,255,255,0.8);
transform:translate(-50%,-50%) scale(0);
opacity:0;
z-index:95;
pointer-events:none;
}
</style>
</head>

<body>

<video class="bg-video" autoplay muted loop playsinline>
<source src="background.mp4" type="video/mp4">
</video>

<div class="bg-overlay"></div>
<div class="bg-glow"></div>

<div class="content">

<div class="tagline">Yeni bir dönem başlıyor.</div>
<div class="tagline-sub">Hazır mısınız?</div>

<div class="timer">

<div class="timer-block">
<div class="timer-num" id="hours">00</div>
<div class="timer-label">Hours</div>
</div>

<div class="timer-sep">:</div>

<div class="timer-block">
<div class="timer-num" id="minutes">00</div>
<div class="timer-label">Minutes</div>
</div>

<div class="timer-sep">:</div>

<div class="timer-block">
<div class="timer-num" id="seconds">00</div>
<div class="timer-label">Seconds</div>
</div>

</div>

<div class="brand" role="img" aria-label="Logo alanı">LOGO</div>

</div>
<div class="explosion-flash"></div>
<div class="shockwave"></div>
<div class="launch-image"></div>

<script>

/* launch state */

if(localStorage.getItem("launchDone")==="true"){
window.addEventListener("DOMContentLoaded",()=>{
document.querySelector(".content").style.display="none";
document.querySelector(".launch-image").style.opacity="1";
});
}

/* countdown */

let launched=false
let timerInterval

let remaining = 20 // 20 saniye

const hoursEl=document.getElementById("hours")
const minutesEl=document.getElementById("minutes")
const secondsEl=document.getElementById("seconds")

function pad(n){
return n<10?"0"+n:n
}

function updateCountdown(){

if(remaining <= 0){

clearInterval(timerInterval)

hoursEl.textContent="00"
minutesEl.textContent="00"
secondsEl.textContent="00"

if(!launched){
launched=true
launchDrop()
}

return
}

const h = Math.floor(remaining / 3600)
const m = Math.floor((remaining % 3600) / 60)
const s = remaining % 60

hoursEl.textContent=pad(h)
minutesEl.textContent=pad(m)
secondsEl.textContent=pad(s)

remaining-- // her saniye azalt
}

updateCountdown()
timerInterval=setInterval(updateCountdown,1000)

/* split characters */

function splitChars(el){

const text=el.innerText
const frag=document.createDocumentFragment()

text.split("").forEach(c=>{
const span=document.createElement("span")
span.className="drop-char"
span.innerText=c
frag.appendChild(span)
})

el.innerHTML=""
el.appendChild(frag)

}

/* explosion animation */

function launchDrop(){

    /* FLASH */

gsap.to(".explosion-flash",{
opacity:1,
duration:0.08,
yoyo:true,
repeat:1
})


/* SHOCKWAVE */

gsap.fromTo(".shockwave",
{scale:0,opacity:1},
{
scale:25,
opacity:0,
duration:1.2,
ease:"power2.out"
})


/* SCREEN SHAKE */

gsap.to(".content",{
x:()=>gsap.utils.random(-20,20),
y:()=>gsap.utils.random(-20,20),
duration:0.05,
repeat:10,
yoyo:true
})



localStorage.setItem("launchDone","true")

const elements=document.querySelectorAll(
".tagline,.tagline-sub,.timer-num,.timer-label,.timer-sep,.brand"
)

elements.forEach(splitChars)

gsap.to(".brand",{borderColor:"transparent",duration:0.3})

const chars=document.querySelectorAll(".drop-char")

gsap.set(chars,{x:0,y:0,rotation:0})

chars.forEach(char=>{

/* tam 360 derece patlama */

const angle = Math.random() * Math.PI * 2

/* ekran dışına çıkacak mesafe */

const distance = Math.max(window.innerWidth, window.innerHeight) * 2

const x = Math.cos(angle) * distance
const y = Math.sin(angle) * distance

gsap.to(char,{
x:x,
y:y,
rotation:gsap.utils.random(-900,900),
scale:gsap.utils.random(0.6,1.3),
duration:3.6,
delay:Math.random()*0.25,
ease:"power1.out"
})

})

gsap.to(".launch-image",{
opacity:1,
delay:1.5,
duration:2.2,
ease:"power2.out"
})

}

</script>

</body>
</html>
