<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buğra Yetiş — Portfolyo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #050508;
      --bg2:     #0b0b14;
      --accent:  #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text:    #e8e8f0;
      --muted:   #6b6b8a;
      --font:    'Space Grotesk', sans-serif;
      --mono:    'Space Mono', monospace;
      --ease:    cubic-bezier(.77, 0, .175, 1);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== SPLIT ===== */
    .split {
      display: flex;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .side {
      position: relative;
      flex: 0 0 50%;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      transition: flex-basis .9s var(--ease), opacity .5s ease;
      outline: none;
    }

    .side--current { background: var(--bg2); }
    .side--new     { background: var(--bg); }

    /* hover: üzerinde olunan taraf %70'e genişler */
    @media (hover: hover) {
      .split:hover .side { flex-basis: 30%; }
      .split .side:hover { flex-basis: 70%; }
    }

    /* tıklanınca tam ekran */
    .split.is-opening .side           { flex-basis: 0%; opacity: 0; }
    .split.is-opening .side.is-chosen { flex-basis: 100%; opacity: 1; }

    /* ===== ARKA PLANLAR ===== */
    /* önizleme tam ekran boyutunda; taraf genişledikçe daha fazlası görünür */
    .preview {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      pointer-events: none;
      opacity: .35;
      transition: opacity .6s ease;
    }
    .side:hover .preview { opacity: .6; }

    /* adventure önizlemesi tarafın ortasına hizalı: BYTE ortada görünsün */
    .side--new .preview {
      left: 50%;
      transform: translateX(-50%);
    }

    .glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .side--current .glow {
      background:
        radial-gradient(ellipse 420px 300px at center, rgba(5,5,8,.8), transparent),
        radial-gradient(ellipse at 30% 70%, rgba(108,99,255,.25), transparent 60%),
        linear-gradient(180deg, rgba(5,5,8,.2), rgba(5,5,8,.85));
    }
    .side--new .glow {
      background:
        radial-gradient(ellipse 420px 300px at center, rgba(5,5,8,.8), transparent),
        radial-gradient(ellipse at 70% 30%, rgba(255,181,71,.18), transparent 55%),
        linear-gradient(180deg, rgba(5,5,8,.2), rgba(5,5,8,.85));
    }


    /* ===== İÇERİK ===== */
    .content {
      position: relative;
      z-index: 2;
      padding: 32px;
      max-width: 460px;
      text-align: center;
      transition: transform .6s var(--ease);
    }
    .side:hover .content { transform: translateY(-6px); }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .title {
      font-size: clamp(2.2rem, 5vw, 4.2rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.03em;
      margin-bottom: 18px;
    }
    .side--current .title span {
      background: linear-gradient(135deg, #6c63ff, #a29bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .side--new .title span {
      background: linear-gradient(135deg, #ffcf6b, #ff6b5b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .desc {
      font-size: .98rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 26px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: background .3s ease, border-color .3s ease, color .3s ease;
    }
    .cta svg { transition: transform .3s ease; }
    .side--current:hover .cta { background: var(--accent); border-color: var(--accent); }
    .side--new:hover .cta     { background: #ffb547; border-color: #ffb547; color: #14101c; }
    .side:hover .cta svg      { transform: translateX(4px); }
    .side:focus-visible .cta  { outline: 2px solid var(--text); outline-offset: 4px; }

    /* küçülen tarafın içeriği geri planda kalır */
    .split:hover .side:not(:hover) .content { opacity: .35; }
    .content { transition: transform .6s var(--ease), opacity .6s ease; }

    /* ===== CANLI YÜZDE ===== */
    .pct {
      position: absolute;
      bottom: 28px;
      z-index: 3;
      font-family: var(--mono);
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.04em;
      color: rgba(255,255,255,.08);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      transition: color .4s ease;
    }
    .side--current .pct { left: 32px; }
    .side--new .pct     { right: 32px; }
    .side:hover .pct    { color: rgba(255,255,255,.22); }

    /* ===== ORTA ÇİZGİ & İSİM ===== */
    .divider {
      position: fixed;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,.15), transparent);
      pointer-events: none;
      z-index: 5;
      transition: opacity .3s ease;
    }
    .brand {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-family: var(--mono);
      font-size: .78rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--text);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .split:hover ~ .divider,
    .is-opening ~ .divider,
    .is-opening ~ .brand { opacity: 0; }

    /* ===== GİRİŞ ANİMASYONU ===== */
    .side .content { animation: rise 1s var(--ease) backwards; }
    .side--new .content { animation-delay: .12s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== MOBİL: üst / alt ===== */
    @media (max-width: 768px) {
      .split { flex-direction: column; }
      .divider {
        top: 50%; bottom: auto;
        left: 0; right: 0;
        width: auto; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
      }
      .brand { top: 16px; font-size: .68rem; }
      .preview { display: none; }
      .content { padding: 24px 16px; }
      .tag { margin-bottom: 12px; }
      .title { margin-bottom: 12px; }
      .desc { font-size: .88rem; margin-bottom: 20px; }
      .cta { padding: 12px 20px; font-size: .72rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .side, .content { transition: none; animation: none; }
    }
  </style>
</head>
<body>

  <main class="split" id="split">
    <a class="side side--current" href="normal-mod" aria-label="Normal mode'u aç">
      <iframe class="preview" src="normal-mod" tabindex="-1" aria-hidden="true" loading="lazy" title="Normal mode önizleme"></iframe>
      <div class="glow"></div>
      <span class="pct" aria-hidden="true">50%</span>
      <div class="content">
        <span class="tag">01 — Klasik</span>
        <h2 class="title"><span>Normal Mode</span></h2>
        <p class="desc">Projelerim, deneyimlerim ve çalışmalarımla şu anki portfolyom.</p>
        <span class="cta">
          Aç
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
    </a>

    <a class="side side--new" href="adventure-mod/" aria-label="Adventure mode'u aç">
      <iframe class="preview" src="adventure-mod/" tabindex="-1" aria-hidden="true" loading="lazy" title="Adventure mode önizleme"></iframe>
      <div class="glow"></div>
      <span class="pct" aria-hidden="true">50%</span>
      <div class="content">
        <span class="tag">02 — Oyun</span>
        <h2 class="title"><span>Adventure Mode</span></h2>
        <p class="desc">Kartuşu tak, projeleri keşfet. Oyun gibi bir portfolyo.</p>
        <span class="cta">
          Aç
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
    </a>
  </main>

  <div class="divider" aria-hidden="true"></div>
  <div class="brand" aria-hidden="true">Buğra Yetiş</div>

  <script>
    const split = document.getElementById('split');

    // Tıklanan taraf tam ekrana genişler, ardından sayfa açılır
    split.querySelectorAll('.side').forEach(side => {
      side.addEventListener('click', e => {
        if (e.metaKey || e.ctrlKey || e.shiftKey) return;
        e.preventDefault();
        if (split.classList.contains('is-opening')) return;
        side.classList.add('is-chosen');
        split.classList.add('is-opening');
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(() => { location.href = side.getAttribute('href'); }, reduce ? 0 : 850);
      });
    });

    // Her tarafın ekranın yüzde kaçını kapladığını canlı göster
    const sides = [...split.querySelectorAll('.side')];
    const vertical = matchMedia('(max-width: 768px)');
    (function updatePct() {
      const total = vertical.matches ? split.clientHeight : split.clientWidth;
      sides.forEach(side => {
        const size = vertical.matches ? side.offsetHeight : side.offsetWidth;
        side.querySelector('.pct').textContent = Math.round(size / total * 100) + '%';
      });
      requestAnimationFrame(updatePct);
    })();

    // Geri tuşuyla dönülünce ekranı sıfırla
    window.addEventListener('pageshow', () => {
      split.classList.remove('is-opening');
      split.querySelectorAll('.is-chosen').forEach(el => el.classList.remove('is-chosen'));
    });
  </script>
</body>
</html>
