            <path d="M106 118h28q-2 16-14 16t-14-16z" fill="#ffcf6b"/>
            <rect x="82" y="114" width="10" height="5" rx="2.5" fill="#ff6b5b" opacity=".7"/>
            <rect x="148" y="114" width="10" height="5" rx="2.5" fill="#ff6b5b" opacity=".7"/>
          </g>
          <g class="face f-wow">
            <circle cx="98" cy="100" r="8" fill="none" stroke="#ffcf6b" stroke-width="4"/>
            <circle cx="142" cy="100" r="8" fill="none" stroke="#ffcf6b" stroke-width="4"/>
            <ellipse cx="120" cy="127" rx="6" ry="7" fill="#ffcf6b"/>
          </g>
          <g class="face f-load">
            <rect class="ld ld1" x="96" y="104" width="10" height="10" fill="#ffcf6b"/>
            <rect class="ld ld2" x="115" y="104" width="10" height="10" fill="#ffcf6b"/>
            <rect class="ld ld3" x="134" y="104" width="10" height="10" fill="#ffcf6b"/>
          </g>
          <g class="face f-dead">
            <path d="M90 92l14 14M104 92l-14 14M136 92l14 14M150 92l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
            <path d="M104 130q8-7 16 0t16 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>
          <!-- yazı & tuşlar -->
          <text x="120" y="176" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#a8702c" letter-spacing="2">BYTE·01</text>
          <rect x="62" y="199" width="30" height="12" rx="2" fill="#3b2c22"/>
          <rect x="71" y="190" width="12" height="30" rx="2" fill="#3b2c22"/>
          <circle cx="164" cy="196" r="10" fill="#ff6b5b"/>
          <circle cx="144" cy="214" r="9" fill="#5ec8ff"/>
          <text x="164" y="200" text-anchor="middle" font-family="Pixelify Sans, monospace" font-size="10" fill="#7a2a22">A</text>
          <text x="144" y="218" text-anchor="middle" font-family="Pixelify Sans, monospace" font-size="9" fill="#1d5a78">B</text>
          <rect x="96" y="236" width="20" height="6" rx="3" fill="#a8702c"/>
          <rect x="122" y="236" width="20" height="6" rx="3" fill="#a8702c"/>
          <g fill="#d9963d"><circle cx="164" cy="236" r="2.4"/><circle cx="173" cy="236" r="2.4"/><circle cx="164" cy="245" r="2.4"/><circle cx="173" cy="245" r="2.4"/><circle cx="182" cy="240" r="2.4"/></g>
          <defs>
            <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffcf6b"/></linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <!-- diyalog -->
    <div class="dialog" id="dialog">
      <span class="dialog__name">BYTE</span>
      <span class="dialog__count" id="cartCount" aria-live="off"></span>
      <button type="button" class="px-btn dialog__restart" id="restartBtn" hidden>↻ Yeniden başlat</button>
      <p class="dialog__text" id="dialogText" aria-live="polite"></p>
      <p class="dialog__hint hint-keys">◀ ▶ seç &nbsp;·&nbsp; Enter tak &nbsp;·&nbsp; B çıkar</p>
      <div class="pad" aria-label="Kontroller">
        <button type="button" class="pad__btn" data-key="left" aria-label="Önceki">◀</button>
        <button type="button" class="pad__btn" data-key="right" aria-label="Sonraki">▶</button>
        <button type="button" class="pad__btn pad__btn--a" data-key="a" aria-label="Tak">A</button>
        <button type="button" class="pad__btn pad__btn--b" data-key="b" aria-label="Çıkar">B</button>
      </div>
    </div>

    <!-- konsol ekranı: takılan kartuşun içeriği -->
    <div class="game" id="game" hidden>
      <div class="game__inner" id="gameInner"></div>
      <div class="game__scan" aria-hidden="true"></div>
    </div>

    <!-- PC ekranından büyüyen mini oyun penceresi -->
    <div class="arcade" id="arcade" hidden>
      <div class="arcade__backdrop" data-close></div>
      <div class="arcade__win" id="arcadeWin" role="dialog" aria-modal="true" aria-label="BYTE Arcade" tabindex="-1">
        <div class="arcade__bar">
          <span class="arcade__dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="arcade__title">BYTE ARCADE · <b id="arcadeTitle"></b></span>
          <span class="arcade__score" id="arcadeScore"></span>
          <button type="button" class="arcade__btn" data-close aria-label="Kapat">✕</button>
        </div>
        <div class="arcade__tabs">
          <button type="button" data-game="snake">Yılan</button>
          <button type="button" data-game="2048">2048</button>
          <button type="button" data-game="bricks">Tuğla Kırma</button>
          <button type="button" class="arcade__restart" data-restart>↻ Yeniden</button>
        </div>
        <div class="arcade__stage" id="arcadeStage"><canvas id="arcadeCanvas"></canvas></div>
        <p class="arcade__hint" id="arcadeHint"></p>
      </div>
    </div>

    <div class="crt-zoom" id="crtZoom" aria-hidden="true"></div>
    <div class="boot" id="boot" aria-hidden="true"><span></span></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="oda.js"></script>
  <script src="arcade.js"></script>
</body>
</html>
